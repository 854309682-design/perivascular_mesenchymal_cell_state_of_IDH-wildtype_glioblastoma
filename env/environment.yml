# Conda route for the companion code of the MES-transition glioblastoma paper.
# Optional: the authors used a Python virtualenv (see env/requirements.txt), which
# records the exact versions. This file is here for a conda/conda-forge user.
#
#   conda env create -f env/environment.yml
#   conda activate paper2
#
# Python 3.12 was used throughout.

name: paper2
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- python core ---
  - python=3.12
  - numpy=2.3
  - pandas=2.3
  - scipy=1.16
  - matplotlib=3.11
  - seaborn=0.13

  # --- single-cell stack ---
  - scanpy=1.12
  - anndata=0.13
  - leidenalg=0.12
  - igraph=1.0
  - scvi-tools=1.5
  - scvelo=0.3

  # --- clinical survival ---
  - lifelines=0.30
  - statsmodels>=0.14

  - pip
  - pip:
      # --- not on conda-forge / pinned exactly as used ---
      - harmonypy==2.0.0
      - scrublet==0.2.3
      - infercnvpy==0.6.1
      - gtfparse
      - decoupler==2.2.0

  # --- Used by manuscript analyses that are NOT part of this release ---------
  # (see README -> "What is not included"); uncomment to attempt those steps:
  #   - pyscenic            # de-novo regulon inference (GRNBoost2 + cisTarget + AUCell)
  #   - arboreto
  #   - loompy
  # and in R (for the NicheNet step):
  #   install.packages("nichenetr")
